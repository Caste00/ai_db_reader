llm: 
  provider: ollama
  model: qwen2.5-coder:3b
  ollama_host: https://localhost:11434

embedding: 
  provider: ollama
  model: mxbai-embed-large:latest

vector_store:
  path: ./rag/chroma_db
  top_k: 5
  distance_threshold: 0.8

database: 
  sqlite_path: ./memory/database.db

target_database:
  type: sqlite3
  url: sqlite:///./test/example_target.db

ask:
  max_attempts: 5

message:
  context_window: 5